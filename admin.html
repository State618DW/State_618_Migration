<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STATE 618 Admin</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080604;color:#f5e6c8;font-family:Arial,sans-serif}.container{width:92%;max-width:900px;margin:30px auto}h1{text-align:center;color:#e5b85c}.subtitle{text-align:center;color:#aaa;margin-bottom:25px}.panel,.application{background:#120d08;border:1px solid #80602c;border-radius:15px;padding:20px;margin-bottom:20px}#loginPanel{max-width:420px;margin:35px auto}label{display:block;margin:12px 0 6px}input{width:100%;padding:12px;border-radius:8px;border:1px solid #80602c;background:#080604;color:#fff}button{border:0;padding:12px 18px;margin:10px 5px 0 0;border-radius:8px;font-weight:bold;cursor:pointer}.primary{background:#e5b85c;color:#160e03}.accept{background:#16813c;color:#fff}.reject{background:#a51f1f;color:#fff}.logout{background:#333;color:#fff}.application h2{margin-top:0;color:#f2c66d}.application p{margin:8px 0;overflow-wrap:anywhere}.status{display:inline-block;padding:7px 12px;border-radius:20px;font-weight:bold;margin:10px 0}.pending{background:#7a5a00;color:#ffe9a6}.approved{background:#145c2e;color:#bfffd0}.rejected{background:#681b1b;color:#ffd0d0}.screenshots{margin-top:15px}.screenshots img{width:100%;max-width:300px;border-radius:10px;margin:5px;border:1px solid #80602c}#message{text-align:center;margin:20px;overflow-wrap:anywhere}.hidden{display:none!important}.error{color:#ff9696}.muted{color:#aaa;font-size:.9rem}
</style>
</head><body><div class="container">
<h1>⚔️ STATE 618 APPLICATIONS ⚔️</h1><div class="subtitle">State 618 Recruitment Management</div>
<section id="loginPanel" class="panel"><h2>Admin Login</h2><form id="loginForm"><label for="adminUsername">Username</label><input id="adminUsername" autocomplete="username" required><label for="adminPassword">Password</label><input id="adminPassword" type="password" autocomplete="current-password" required><button class="primary" id="loginButton" type="submit">Log in</button></form><p id="loginMessage" class="error" role="status"></p></section>
<section id="dashboard" class="hidden"><div style="display:flex;justify-content:flex-end"><button class="logout" id="logoutButton">Log out</button></div><div id="message">Loading applications...</div><div id="applications"></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
const adminClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const loginPanel=document.getElementById('loginPanel'),dashboard=document.getElementById('dashboard'),loginForm=document.getElementById('loginForm'),loginMessage=document.getElementById('loginMessage'),loginButton=document.getElementById('loginButton'),message=document.getElementById('message'),applicationsDiv=document.getElementById('applications');
function escapeHtml(value){return value==null?'':String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function isAdmin(user){return !!user && user.app_metadata && user.app_metadata.role==='admin'}
async function showDashboard(user){if(!isAdmin(user)){await adminClient.auth.signOut();loginMessage.textContent='This account is not authorized as an admin.';return}loginPanel.classList.add('hidden');dashboard.classList.remove('hidden');await loadApplications()}
loginForm.addEventListener('submit',async e=>{e.preventDefault();loginButton.disabled=true;loginMessage.textContent='Signing in...';try{const username=document.getElementById('adminUsername').value.trim();const password=document.getElementById('adminPassword').value;if(username!==ADMIN_USERNAME)throw new Error('Incorrect username or password.');if(!ADMIN_LOGIN_EMAIL||ADMIN_LOGIN_EMAIL.startsWith('REPLACE_'))throw new Error('Set ADMIN_LOGIN_EMAIL in config.js first.');const {data,error}=await adminClient.auth.signInWithPassword({email:ADMIN_LOGIN_EMAIL,password});if(error)throw error;if(!isAdmin(data.user)){await adminClient.auth.signOut();throw new Error('This account is not authorized as an admin. Ask the setup owner to finish the SQL setup.')}loginMessage.textContent='';await showDashboard(data.user)}catch(err){loginMessage.textContent=err.message||'Login failed.'}finally{loginButton.disabled=false}});
document.getElementById('logoutButton').addEventListener('click',async()=>{await adminClient.auth.signOut();dashboard.classList.add('hidden');loginPanel.classList.remove('hidden');applicationsDiv.replaceChildren();loginForm.reset()});
async function loadApplications(){message.textContent='Loading applications...';applicationsDiv.replaceChildren();const {data,error}=await adminClient.from(APPLICATION_TABLE).select('*').order('created_at',{ascending:false});if(error){message.textContent='Could not load applications: '+error.message;return}if(!data||!data.length){message.textContent='No applications yet.';return}message.textContent='';for(const app of data){const card=document.createElement('article');card.className='application';const status=app.status||'pending';let images='';let paths=Array.isArray(app.image_urls)?app.image_urls:(typeof app.image_urls==='string'?app.image_urls.split(',').map(x=>x.trim()).filter(Boolean):[]);for(const path of paths){const {data:imageData,error:imageError}=await adminClient.storage.from(IMAGE_BUCKET).createSignedUrl(path,3600);if(!imageError&&imageData?.signedUrl){images+=`<a href="${escapeHtml(imageData.signedUrl)}" target="_blank" rel="noopener"><img src="${escapeHtml(imageData.signedUrl)}" alt="Application screenshot" loading="lazy"></a>`}}card.innerHTML=`<h2>${escapeHtml(app.username||'Unknown Player')}</h2><p><strong>Game ID:</strong> ${escapeHtml(app.game_id)}</p><p><strong>Current State:</strong> ${escapeHtml(app.current_state)}</p><p><strong>Current Clan:</strong> ${escapeHtml(app.current_clan)}</p><p><strong>Preferred Clan:</strong> ${escapeHtml(app.preferred_clan)}</p><p><strong>Backup Clan:</strong> ${escapeHtml(app.backup_clan)}</p><p><strong>Watchtower Level:</strong> ${escapeHtml(app.watchtower_level)}</p><p><strong>Overall Power:</strong> ${escapeHtml(app.overall_power)}</p><p><strong>First March:</strong> ${escapeHtml(app.first_march_power)}</p><p><strong>Second March:</strong> ${escapeHtml(app.second_march_power)}</p><p><strong>Third March:</strong> ${escapeHtml(app.third_march_power)}</p><p><strong>Reason:</strong><br>${escapeHtml(app.reason)}</p><div class="status ${['pending','approved','rejected'].includes(status)?status:'pending'}">${escapeHtml(status.toUpperCase())}</div><div class="screenshots">${images||'<p class="muted">No images, or image access is not configured.</p>'}</div><button class="accept" data-id="${escapeHtml(app.id)}" data-status="approved">✓ APPROVE</button><button class="reject" data-id="${escapeHtml(app.id)}" data-status="rejected">✕ REJECT</button>`;applicationsDiv.appendChild(card)} }
applicationsDiv.addEventListener('click',async e=>{const button=e.target.closest('button[data-id]');if(!button)return;button.disabled=true;const {error}=await adminClient.from(APPLICATION_TABLE).update({status:button.dataset.status}).eq('id',button.dataset.id);if(error){alert('Could not update application: '+error.message);button.disabled=false;return}await loadApplications()});
adminClient.auth.getSession().then(({data})=>{if(data.session)showDashboard(data.session.user)});
adminClient.auth.onAuthStateChange((_event,session)=>{if(!session){dashboard.classList.add('hidden');loginPanel.classList.remove('hidden')}});
</script></body></html>
